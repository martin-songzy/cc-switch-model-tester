name: build

# 触发：push 到 master 自动编译（更新「Latest 构建」预发布）；
# push v* 标签出正式 Release；Actions 页面可手动触发。
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cc-switch-model-tester/package-lock.json

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 编译缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cc-switch-model-tester/src-tauri

      - name: 安装前端依赖
        working-directory: cc-switch-model-tester
        run: npm ci

      - name: 前端类型检查
        working-directory: cc-switch-model-tester
        run: npm run check

      - name: 构建便携版 exe
        working-directory: cc-switch-model-tester
        run: npm run tauri build -- --no-bundle

      - name: 更新「Latest 构建」预发布
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete continuous --cleanup-tag -y --repo "$GITHUB_REPOSITORY" 2>$null
          gh release create continuous "cc-switch-model-tester/src-tauri/target/release/cc-switch-model-tester.exe" `
            --repo "$GITHUB_REPOSITORY" --prerelease `
            --title "Latest 构建（自动更新）" `
            --notes "自动构建于 commit ${{ github.sha }}（$(Get-Date -Format 'yyyy-MM-dd HH:mm') UTC）。此条目随每次 push 自动替换。"

      - name: 发布正式版
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" "cc-switch-model-tester/src-tauri/target/release/cc-switch-model-tester.exe" `
            --repo "$GITHUB_REPOSITORY" --generate-notes `
            --title "cc-switch Model Tester ${{ github.ref_name }}"
